<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>漫畫跨頁分割器</title>
  <style>
    body { text-align: center; font-family: sans-serif; }
    .canvas-row { display: flex; justify-content: center; margin-top: 20px; }
    canvas { border: 1px solid #4caf50; margin: 0 10px; }
    #topCanvas { width: 400px; height: 300px; }
    #leftCanvas, #rightCanvas { width: 200px; height: 300px; }
    .controls { margin-top: 20px; }
    label { margin-right: 10px; }
    #info { margin-top: 10px; color: #333; }
    #fileInput { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>漫畫跨頁分割器</h2>
  <div>
    <canvas id="topCanvas" width="400" height="300"></canvas>
  </div>
  <div id="info"></div>
  <div class="controls">
    <input type="file" id="fileInput" accept="image/*">
    <button id="loadBtn">載入圖片</button>
    <label>黑條寬度: <input type="number" id="barWidth" min="0" max="200" value="20"></label>
    <button id="splitBtn">分割圖片</button>
  </div>
  <div class="canvas-row">
    <canvas id="leftCanvas" width="200" height="300"></canvas>
    <canvas id="rightCanvas" width="200" height="300"></canvas>
  </div>

  <script>
    const topCanvas = document.getElementById('topCanvas');
    const leftCanvas = document.getElementById('leftCanvas');
    const rightCanvas = document.getElementById('rightCanvas');
    const barWidthInput = document.getElementById('barWidth');
    const splitBtn = document.getElementById('splitBtn');
    const infoDiv = document.getElementById('info');
    const fileInput = document.getElementById('fileInput');
    const loadBtn = document.getElementById('loadBtn');
    let img = null;
    let imgFile = null;

    // 拖曳圖片到 topCanvas
    topCanvas.addEventListener('dragover', e => e.preventDefault());
    topCanvas.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        imgFile = file;
        loadImageFile(file);
      }
    });

    // 點選載入圖片按鈕
    loadBtn.onclick = function() {
      if (!fileInput.files[0]) {
        alert('請先選擇圖片檔案！');
        return;
      }
      imgFile = fileInput.files[0];
      loadImageFile(imgFile);
    };

    // 圖片載入函數
    function loadImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        img = new Image();
        img.onload = function() {
          infoDiv.innerHTML = `原圖尺寸：<b>${img.width} x ${img.height}</b> pixel`;
          // 畫原圖
          const ctx = topCanvas.getContext('2d');
          ctx.clearRect(0, 0, topCanvas.width, topCanvas.height);
          let scale = Math.min(topCanvas.width / img.width, topCanvas.height / img.height);
          let w = img.width * scale;
          let h = img.height * scale;
          ctx.drawImage(img, (topCanvas.width-w)/2, (topCanvas.height-h)/2, w, h);
          // 設定下方 canvas 尺寸
          leftCanvas.width = rightCanvas.width = Math.floor(img.width/2);
          leftCanvas.height = rightCanvas.height = img.height;
        }
        img.src = evt.target.result;
      }
      reader.readAsDataURL(file);
    }

    // 分割圖片
    splitBtn.onclick = function() {
      if (!img) return alert('請先載入圖片！');
      const W = img.width;
      const H = img.height;
      const B = Math.min(parseInt(barWidthInput.value, 10), Math.floor(W/2));
      const W_1 = Math.floor(W/2);

      // 圖一：左半，右側有黑條
      const leftCtx = leftCanvas.getContext('2d');
      leftCtx.clearRect(0, 0, leftCanvas.width, leftCanvas.height);
      // 1.1. 放原圖 (B,0)-(W/2,0)-(B,H)-(W/2,H) 到 (0,0)-(W/2-B,0)-(0,H)-(W/2-B,H)
      leftCtx.drawImage(
        img,
        B, 0, W_1-B, H,      // 原圖來源區域
        0, 0, W_1-B, H      // 目標區域
      );
      // 1.2. 畫右側黑條 (W/2-B,0)-(W/2,0)-(W/2-B,H)-(W/2,H)
      leftCtx.fillStyle = 'black';
      leftCtx.fillRect(W_1-B, 0, B, H);

      // 圖二：右半，左側有黑條
      const rightCtx = rightCanvas.getContext('2d');
      rightCtx.clearRect(0, 0, rightCanvas.width, rightCanvas.height);
      // 2.1. 畫左側黑條 (0,0)-(B,0)-(0,H)-(B,H)
      rightCtx.fillStyle = 'black';
      rightCtx.fillRect(0, 0, B, H);
      // 2.2. 放原圖 (W/2,0)-(W-B,0)-(W/2,H)-(W-B,H) 到 (B,0)-(W/2,0)-(B,H)-(W/2,H)
      rightCtx.drawImage(
        img,
        W_1, 0, W-B-W_1, H,   // 原圖來源區域
        B, 0, W_1-B, H        // 目標區域
      );
    };
  </script>
</body>
</html>
